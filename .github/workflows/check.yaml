name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: ./...
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Prepare Docker fixture
        if: runner.os == 'Linux'
        run: docker run -d --name termbridge-ci busybox:1.37 sleep 600
      - name: Test
        shell: bash
        run: |
          mkdir -p bin tmp/go tmp/tests
          export GOTMPDIR="$PWD/tmp/go" TMPDIR="$PWD/tmp/tests" GORACE=atexit_sleep_ms=0
          go build -race -o bin/termbridge .
          export TERMBRIDGE_TEST_BIN="$PWD/bin/termbridge"
          if [ "$RUNNER_OS" = Linux ]; then
            export TERMBRIDGE_TEST_DOCKER_CONTEXT=default
            export TERMBRIDGE_TEST_DOCKER_CONTAINER=termbridge-ci
          fi
          go test -race -count=1 -timeout=2m -coverprofile=coverage.txt ./...
      - name: Clean up Docker fixture
        if: always() && runner.os == 'Linux'
        run: |
          if docker container inspect termbridge-ci >/dev/null 2>&1; then
            docker rm -f -v termbridge-ci
          fi

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o bin/termbridge_${{ matrix.goos }}_${{ matrix.goarch }} .
